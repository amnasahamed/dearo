name: Verify Dearo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run export:native
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Intentionally fails while the documented high toolchain findings remain.
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
